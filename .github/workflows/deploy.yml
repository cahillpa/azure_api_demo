name: Build and Deploy Azure Function

on:
  push:
    branches:
      - main  # Trigger deployment on push to the main branch
  workflow_dispatch:  # Allows manual triggering of the workflow

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build and package with Maven
        run: mvn clean package

      - name: Deploy to Azure Functions
        uses: azure/functions-action@v1
        with:
          app-name: azure-api-demo-function  # Replace with your Azure Function App name
          package: target/azure-functions/azure-api-demo-function
          publish-profile: ${{ secrets.PUBLISH_AZURE_FUNCTIONS }}
